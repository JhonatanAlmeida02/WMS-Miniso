# Render: New > Blueprint > escolha este repositório. Cria um Static Site
# gratuito (não dorme e não usa as horas dos serviços web).
services:
  - type: web
    runtime: static
    name: prodigy-wms
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Projeto Supabase "prodigy-wms". Valores públicos (a chave publishable só
      # funciona junto com o login e as regras do banco).
      - key: VITE_SUPABASE_URL
        value: https://rlumdaekikrmeqqzxqst.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_-qN_RevVUtRSnjhs4-by3g_TeYLcxjw
    routes:
      # Todas as telas (/painel, /separacao...) abrem o app
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
