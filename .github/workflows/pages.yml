# Publica o app no GitHub Pages a cada push na main.
# Uma vez só: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # O site fica em https://<usuario>.github.io/<repositorio>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Projeto Supabase "prodigy-wms" (valores públicos)
          VITE_SUPABASE_URL: https://rlumdaekikrmeqqzxqst.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_-qN_RevVUtRSnjhs4-by3g_TeYLcxjw
      # O Pages não tem "rewrite": a página de erro vira o app, e assim
      # /painel, /separacao etc. abrem direto (e ao recarregar)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
